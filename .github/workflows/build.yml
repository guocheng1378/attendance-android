name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 签名 Secrets 提到 job 级 env：step 的 `if` 读不到同一个 step 里定义的 env，
    # 只有 job/workflow 级 env 才能出现在 steps.if 表达式里。
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Gradle（缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 编译检查（含 lint 前的 Kotlin 编译）
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: 单元测试（工资引擎口径回归）
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # 读 JUnit XML 报告，确认回归用例真的执行了多少条（而不是任务空跑绿）。
      # 不依赖 Gradle 侧 testLogging 配置，避免 DSL 版本差异导致构建失败。
      - name: 打印用例执行明细
        if: always()
        run: |
          DIR=app/build/test-results/testDebugUnitTest
          if [ ! -d "$DIR" ]; then
            echo "::error::未找到测试报告目录 $DIR"
            exit 1
          fi
          python3 - "$DIR" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob(sys.argv[1] + "/TEST-*.xml"))
          if not files:
              print("::error::报告目录为空，测试未执行")
              sys.exit(1)
          t = f = e = s = 0
          for p in files:
              r = ET.parse(p).getroot()
              g = lambda k: int(float(r.get(k, 0)))
              t += g("tests"); f += g("failures"); e += g("errors"); s += g("skipped")
              print("  %s: tests=%d failures=%d errors=%d skipped=%d time=%ss"
                    % (r.get("name"), g("tests"), g("failures"), g("errors"), g("skipped"), r.get("time")))
          print("TOTAL tests=%d failures=%d errors=%d skipped=%d passed=%d" % (t, f, e, s, t - f - e - s))
          if t == 0 or f or e:
              print("::error::回归用例未真正通过")
              sys.exit(1)
          PY

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 Debug APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: attendance-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 以下仅在配置了签名 Secrets 时执行；未配置（如 fork 的 PR）时静默跳过，不影响 Debug 产物。
      # 解到 $GITHUB_WORKSPACE 下（.gitignore 已含 *.keystore，不会被 checkout 目录里的构建步骤误提交）。
      - name: 解码签名密钥库
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      # 口令走 step 级 env，变量名与 app/build.gradle.kts 里 signingProp() 读的完全一致：
      # KEYSTORE_PATH / KEYSTORE_PASS / KEY_ALIAS / KEY_PASSWORD。
      # 注意 Secret 叫 KEYSTORE_PASSWORD，而 gradle 读的是 KEYSTORE_PASS——名字不一致，靠这里映射。
      - name: 编译 Signed Release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASS: ${{ env.KS_PASSWORD }}
          KEY_ALIAS: ${{ env.KS_ALIAS }}
          KEY_PASSWORD: ${{ env.KS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 Release APK 产物
        if: ${{ env.KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attendance-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: 打 tag 时创建 Release 并挂 APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/*/*.apk
          generate_release_notes: true
